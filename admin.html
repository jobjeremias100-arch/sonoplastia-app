<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonoplastia — Administração</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-deep:     #09090f;
      --bg-panel:    #111118;
      --bg-card:     #16161f;
      --bg-card-alt: #1c1c28;
      --border:      #2a2a3a;
      --border-glow: #3d3d5c;
      --text:        #e8e8f0;
      --text-muted:  #6b6b88;
      --text-dim:    #3a3a55;
      --accent:      #7c6af7;
      --accent-dim:  #3e3578;
      --accent-glow: rgba(124,106,247,0.25);
      --green:       #3ecf8e;
      --green-dim:   #1a5c40;
      --red:         #f04a5a;
      --red-dim:     rgba(240,74,90,0.15);
      --amber:       #f5a623;
      --radius:      10px;
      --font-mono:   'JetBrains Mono', monospace;
      --font-display:'Syne', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-deep);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      min-height: 100vh;
    }

    /* ── Tela de senha ── */
    #tela-senha {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .senha-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      position: relative;
    }

    .senha-card::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 60%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .senha-icon {
      width: 56px; height: 56px;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 24px var(--accent-glow);
    }

    .senha-titulo {
      text-align: center;
    }

    .senha-titulo h1 {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .senha-titulo p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .senha-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-input {
      width: 100%;
      padding: 11px 16px;
      background: var(--bg-deep);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      letter-spacing: 0.1em;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      text-align: center;
    }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      color: #fff;
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
    }

    .btn-primary:hover {
      background: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .erro-msg {
      display: none;
      font-size: 11px;
      color: var(--red);
      text-align: center;
      padding: 7px 12px;
      background: var(--red-dim);
      border: 1px solid rgba(240,74,90,0.3);
      border-radius: 6px;
    }

    .erro-msg.visivel { display: block; }

    /* ── Tela admin ── */
    #tela-admin { display: none; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px; height: 34px;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .btn-sair {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--red);
      background: var(--red-dim);
      color: var(--red);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-sair:hover { background: rgba(240,74,90,0.3); }

    .content {
      max-width: 700px;
      margin: 0 auto;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      display: block;
      width: 14px; height: 1px;
      background: var(--border-glow);
    }

    /* ── Formulário nova sala ── */
    .nova-sala-form {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      margin-bottom: 5px;
    }

    .form-group .form-input {
      text-align: left;
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .form-hint {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 3px;
    }

    .btn-criar {
      padding: 10px 20px;
      background: var(--green-dim);
      border: 1px solid var(--green);
      border-radius: var(--radius);
      color: var(--green);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
      align-self: flex-start;
    }

    .btn-criar:hover {
      background: var(--green);
      color: #000;
      box-shadow: 0 0 16px rgba(62,207,142,0.3);
    }

    /* ── Lista de salas ── */
    .sala-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: border-color 0.2s;
    }

    .sala-card.ativa  { border-color: var(--green-dim); }
    .sala-card.inativa { opacity: 0.5; }

    .sala-info { flex: 1; }

    .sala-nome {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .sala-codigo {
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.08em;
    }

    .sala-acoes {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .badge-status {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 99px;
    }

    .badge-ativa  { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
    .badge-inativa { background: var(--red-dim); color: var(--red); border: 1px solid var(--red); }

    .btn-toggle {
      padding: 6px 14px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid var(--border);
      background: var(--bg-card-alt);
      color: var(--text-muted);
    }

    .btn-toggle:hover { border-color: var(--accent); color: var(--text); }

    .btn-excluir {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--red);
      background: var(--red-dim);
      color: var(--red);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-excluir:hover { background: rgba(240,74,90,0.3); }

    .lista-vazia {
      text-align: center;
      color: var(--text-muted);
      font-style: italic;
      padding: 32px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    /* Toast */
    #toast-container {
      position: fixed;
      bottom: 24px; right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: var(--bg-card-alt);
      border: 1px solid var(--border-glow);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 12px;
      color: var(--text);
      min-width: 220px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toast-in 0.25s ease;
    }

    .toast.success { border-left: 3px solid var(--green); }
    .toast.error   { border-left: 3px solid var(--red); }
    .toast.info    { border-left: 3px solid var(--accent); }

    @keyframes toast-in {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
      .sala-card { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- ── Tela de login Google ── -->
  <div id="tela-senha">
    <div class="senha-card">
      <div class="senha-icon">🔐</div>
      <div class="senha-titulo">
        <h1>Administração</h1>
        <p>Área restrita — apenas administradores autorizados</p>
      </div>
      <button class="btn-primary" onclick="loginGoogle()" style="display:flex; align-items:center; justify-content:center; gap:10px;">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.2 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 20-9 20-20 0-1.3-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 19 12 24 12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.2 0-9.6-2.8-11.3-7L6 33.5C9.4 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.9 2.5-2.6 4.6-4.8 6l6.2 5.2C40.5 35.7 44 30.3 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
        Entrar com Google
      </button>
      <div class="erro-msg visivel" id="erro-senha" style="display:none"></div>
    </div>
  </div>

  <!-- ── Tela admin ── -->
  <div id="tela-admin">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">🔐</div>
        <div>
          <div class="brand-title">Sonoplastia</div>
          <div class="brand-sub">Administração de Salas</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <img id="admin-foto" src="" style="width:28px; height:28px; border-radius:50%; display:none;" />
        <div style="text-align:right;">
          <div id="admin-nome" style="font-size:12px; font-weight:600;"></div>
          <div id="admin-email" style="font-size:10px; color:var(--text-muted);"></div>
        </div>
        <button class="btn-sair" onclick="sairAdmin()">✕ Sair</button>
      </div>
    </header>

    <div class="content">

      <!-- Criar nova sala -->
      <div>
        <div class="section-title">➕ Nova Sala</div>
        <div class="nova-sala-form">
          <div class="form-row">
            <div class="form-group">
              <label>Nome da Igreja</label>
              <input class="form-input" type="text" id="nova-nome" placeholder="Ex: Igreja Central" />
            </div>
            <div class="form-group">
              <label>Código de Acesso</label>
              <input class="form-input" type="text" id="nova-codigo" placeholder="Ex: central2025" />
              <div class="form-hint">Só letras, números e hífen. Sem espaços.</div>
            </div>
          </div>
          <button class="btn-criar" onclick="criarSala()">＋ Criar Sala</button>
        </div>
      </div>

      <!-- Lista de salas -->
      <div>
        <div class="section-title">🏛️ Salas Cadastradas</div>
        <div id="lista-salas">
          <div class="lista-vazia">Carregando salas…</div>
        </div>
      </div>

    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { db } from "./firebase-config.js";
    import {
      collection,
      getDocs,
      setDoc,
      updateDoc,
      deleteDoc,
      doc,
      onSnapshot,
      serverTimestamp,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const auth     = getAuth();
    const provider = new GoogleAuthProvider();

    // ==========================================================
    // ⚠️ COLOQUE AQUI OS E-MAILS DOS ADMINISTRADORES AUTORIZADOS
    const ADMINS_AUTORIZADOS = [
      "job.jeremias100@gmail.com",
    ];
    // ==========================================================

    // ── Observa estado do login ──
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Usuário logado — verifica se é admin autorizado
        if (ADMINS_AUTORIZADOS.includes(user.email)) {
          document.getElementById("tela-senha").style.display    = "none";
          document.getElementById("tela-admin").style.display    = "block";
          document.getElementById("admin-nome").textContent      = user.displayName || user.email;
          document.getElementById("admin-email").textContent     = user.email;
          document.getElementById("admin-foto").src             = user.photoURL || "";
          document.getElementById("admin-foto").style.display   = user.photoURL ? "block" : "none";
          carregarSalas();
        } else {
          // Email não autorizado
          showToast("Acesso negado. Este e-mail não é administrador.", "error");
          signOut(auth);
        }
      } else {
        // Não logado — mostra tela de login
        document.getElementById("tela-senha").style.display = "flex";
        document.getElementById("tela-admin").style.display = "none";
      }
    });

    // ── Login com Google ──
    window.loginGoogle = async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        console.error(e);
        showToast("Erro ao fazer login. Tente novamente.", "error");
      }
    };

    // ── Sair ──
    window.sairAdmin = async () => {
      await signOut(auth);
    };

    // ── Carregar salas em tempo real ──
    function carregarSalas() {
      onSnapshot(collection(db, "salas_permitidas"), (snap) => {
        const lista = document.getElementById("lista-salas");

        if (snap.empty) {
          lista.innerHTML = `<div class="lista-vazia">Nenhuma sala cadastrada ainda.</div>`;
          return;
        }

        const salas = [];
        snap.forEach(d => salas.push({ id: d.id, ...d.data() }));
        salas.sort((a, b) => a.nome?.localeCompare(b.nome));

        lista.innerHTML = salas.map(sala => `
          <div class="sala-card ${sala.ativa ? 'ativa' : 'inativa'}" style="margin-bottom:8px;">
            <div class="sala-info">
              <div class="sala-nome">${_esc(sala.nome || sala.id)}</div>
              <div class="sala-codigo">🔑 ${sala.id}</div>
            </div>
            <div class="sala-acoes">
              <span class="badge-status ${sala.ativa ? 'badge-ativa' : 'badge-inativa'}">
                ${sala.ativa ? 'Ativa' : 'Inativa'}
              </span>
              <button class="btn-toggle" onclick="toggleSala('${sala.id}', ${sala.ativa})">
                ${sala.ativa ? 'Desativar' : 'Ativar'}
              </button>
              <button class="btn-excluir" onclick="excluirSala('${sala.id}')" title="Excluir sala">🗑</button>
            </div>
          </div>
        `).join("");
      });
    }

    // ── Criar nova sala ──
    window.criarSala = async () => {
      const nome   = document.getElementById("nova-nome").value.trim();
      const codigo = document.getElementById("nova-codigo").value.trim()
                       .toLowerCase().replace(/\s+/g, "-").replace(/[^a-z0-9-]/g, "");

      if (!nome || !codigo) {
        showToast("Preencha o nome e o código.", "error");
        return;
      }

      if (codigo.length < 3) {
        showToast("Código deve ter pelo menos 3 caracteres.", "error");
        return;
      }

      try {
        await setDoc(doc(db, "salas_permitidas", codigo), {
          nome,
          ativa:    true,
          criadaEm: serverTimestamp(),
        });

        document.getElementById("nova-nome").value   = "";
        document.getElementById("nova-codigo").value = "";
        showToast(`Sala "${nome}" criada! Código: ${codigo}`, "success");
      } catch (e) {
        console.error(e);
        showToast("Erro ao criar sala.", "error");
      }
    };

    // ── Ativar / Desativar sala ──
    window.toggleSala = async (id, ativaAtual) => {
      try {
        await updateDoc(doc(db, "salas_permitidas", id), { ativa: !ativaAtual });
        showToast(`Sala ${!ativaAtual ? "ativada" : "desativada"}.`, "info");
      } catch (e) {
        console.error(e);
        showToast("Erro ao atualizar sala.", "error");
      }
    };

    // ── Excluir sala ──
    window.excluirSala = async (id) => {
      if (!confirm(`Excluir a sala "${id}"? Esta ação não pode ser desfeita.`)) return;
      try {
        await deleteDoc(doc(db, "salas_permitidas", id));
        showToast("Sala excluída.", "info");
      } catch (e) {
        console.error(e);
        showToast("Erro ao excluir sala.", "error");
      }
    };

    // ── Utilitários ──
    function _esc(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    window.showToast = (msg, tipo = "info") => {
      const container = document.getElementById("toast-container");
      const icons = { success: "✅", error: "❌", info: "ℹ️" };
      const toast = document.createElement("div");
      toast.className = `toast ${tipo}`;
      toast.innerHTML = `<span>${icons[tipo]}</span><span>${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transition = "opacity 0.3s";
        setTimeout(() => toast.remove(), 320);
      }, 4000);
    };
  </script>

</body>
</html>
