<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projeção</title>

  <style>
    /* =========================================================
       TELA DE PROJEÇÃO — TOTALMENTE LIMPA
       Fundo preto absoluto, sem qualquer elemento de UI visível.
       Todo controle é feito remotamente pelo Firestore.
    ========================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: none; /* Esconde o cursor no projetor */
    }

    /* Container principal que ocupa toda a tela */
    #projecao-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* =====================================================
       PLAYER DE YOUTUBE
    ===================================================== */
    #youtube-wrapper {
      display: none;
      position: absolute;
      inset: 0;
    }

    /* O iframe do YouTube ocupa 100% da tela */
    #youtube-player {
      width: 100%;
      height: 100%;
    }

    /* =====================================================
       PLAYER DE ÁUDIO
       Exibe um fundo preto limpo enquanto o áudio toca.
       (Elemento <audio> invisível)
    ===================================================== */
    #audio-wrapper {
      display: none;
      position: absolute;
      inset: 0;
      background: #000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
    }

    /* Indicador visual sutil para o áudio (não exibido na projeção) */
    .audio-wave {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 60px;
    }

    .audio-wave span {
      display: block;
      width: 6px;
      background: #1a1a1a;
      border-radius: 3px;
      animation: none;
    }

    .audio-playing .audio-wave span {
      background: #2a2a2a;
      animation: wave 1.2s ease-in-out infinite;
    }

    .audio-wave span:nth-child(1) { height: 20px; animation-delay: 0s; }
    .audio-wave span:nth-child(2) { height: 35px; animation-delay: 0.1s; }
    .audio-wave span:nth-child(3) { height: 50px; animation-delay: 0.2s; }
    .audio-wave span:nth-child(4) { height: 30px; animation-delay: 0.3s; }
    .audio-wave span:nth-child(5) { height: 45px; animation-delay: 0.4s; }
    .audio-wave span:nth-child(6) { height: 20px; animation-delay: 0.5s; }
    .audio-wave span:nth-child(7) { height: 38px; animation-delay: 0.15s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.4); }
      50%       { transform: scaleY(1.2); }
    }

    /* Elemento de áudio oculto */
    #audio-player { display: none; }

    /* =====================================================
       PLAYER DE VÍDEO
    ===================================================== */
    #video-wrapper {
      display: none;
      position: absolute;
      inset: 0;
      background: #000;
    }

    #video-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      /* Remove qualquer controle nativo do navegador */
      pointer-events: none;
    }

    /* Botão de tela cheia — aparece ao mover o mouse */
    #btn-fullscreen {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      background: rgba(124, 106, 247, 0.15);
      border: 1px solid rgba(124, 106, 247, 0.5);
      color: rgba(255,255,255,0.7);
      font-family: monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #btn-fullscreen.visivel {
      opacity: 1;
      pointer-events: auto;
    }

    #btn-fullscreen:hover {
      background: rgba(124, 106, 247, 0.4);
      color: #fff;
    }
</head>
<body>

  <!-- Botão de tela cheia — aparece ao mover o mouse, some após 3s -->
  <button id="btn-fullscreen">⛶ Tela Cheia</button>

  <div id="projecao-container">

    <!-- Player do YouTube (controlado pelo Firestore) -->
    <div id="youtube-wrapper">
      <div id="youtube-player"></div>
    </div>

    <!-- Player de Áudio (fundo preto durante a reprodução) -->
    <div id="audio-wrapper">
      <div class="audio-wave">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
      <audio id="audio-player" preload="auto"></audio>
    </div>

    <!-- Player de Vídeo -->
    <div id="video-wrapper">
      <video id="video-player" preload="auto" playsinline disablePictureInPicture></video>
    </div>

  </div>

  <!-- Script de escuta do Firebase e controle dos players -->
  <script type="module" src="app.js"></script>

  <!-- Tela cheia automática ao abrir + botão discreto -->
  <script>
    const btn = document.getElementById("btn-fullscreen");
    let timerBtn = null;

    // Mostra o botão ao mover o mouse, some após 3s
    document.addEventListener("mousemove", () => {
      btn.classList.add("visivel");
      clearTimeout(timerBtn);
      timerBtn = setTimeout(() => btn.classList.remove("visivel"), 3000);
    });

    // Alterna tela cheia ao clicar no botão
    btn.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        const el = document.documentElement;
        if      (el.requestFullscreen)       el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
        btn.textContent = "✕ Sair Tela Cheia";
      } else {
        if      (document.exitFullscreen)       document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        btn.textContent = "⛶ Tela Cheia";
      }
    });

    // Atualiza o texto do botão ao sair da tela cheia pelo teclado (ESC)
    document.addEventListener("fullscreenchange", () => {
      btn.textContent = document.fullscreenElement ? "✕ Sair Tela Cheia" : "⛶ Tela Cheia";
    });
  </script>
</body>
</html>
