<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a14"/>
      <stop offset="100%" style="stop-color:#0f0f1e"/>
    </linearGradient>
    <linearGradient id="fader1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a3fa0"/>
      <stop offset="100%" style="stop-color:#6c5ce7"/>
    </linearGradient>
    <linearGradient id="fader2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a3a8f"/>
      <stop offset="100%" style="stop-color:#2155b5"/>
    </linearGradient>
    <linearGradient id="fader3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a3fa0"/>
      <stop offset="100%" style="stop-color:#6c5ce7"/>
    </linearGradient>
    <linearGradient id="fader4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a3a8f"/>
      <stop offset="100%" style="stop-color:#2155b5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-orange">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!-- Borda sutil -->
  <rect x="3" y="3" width="506" height="506" rx="88" fill="none" stroke="#2a1f6e" stroke-width="3" opacity="0.6"/>

  <!-- === FADER 1 === -->
  <!-- Trilha -->
  <rect x="90" y="80" width="6" height="352" rx="3" fill="#1a1a2e"/>
  <!-- Trilha ativa (abaixo do knob) -->
  <rect x="90" y="248" width="6" height="184" rx="3" fill="#4a3fa0" opacity="0.5"/>
  <!-- Knob -->
  <rect x="72" y="228" width="42" height="24" rx="7" fill="url(#fader1)" filter="url(#glow)"/>
  <!-- Linha central do knob -->
  <rect x="80" y="239" width="26" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>

  <!-- === FADER 2 === -->
  <!-- Trilha -->
  <rect x="183" y="80" width="6" height="352" rx="3" fill="#1a1a2e"/>
  <!-- Trilha ativa -->
  <rect x="183" y="160" width="6" height="272" rx="3" fill="#1a3a8f" opacity="0.5"/>
  <!-- Knob -->
  <rect x="165" y="140" width="42" height="24" rx="7" fill="url(#fader2)" filter="url(#glow)"/>
  <!-- Linha central do knob -->
  <rect x="173" y="151" width="26" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>

  <!-- === FADER 3 — ATIVO (laranja) === -->
  <!-- Trilha -->
  <rect x="276" y="80" width="6" height="352" rx="3" fill="#1a1a2e"/>
  <!-- Trilha ativa -->
  <rect x="276" y="310" width="6" height="122" rx="3" fill="#e07020" opacity="0.4"/>
  <!-- Knob — destaque laranja -->
  <rect x="258" y="290" width="42" height="24" rx="7" fill="#c96010" filter="url(#glow-orange)"/>
  <!-- Borda laranja vibrante -->
  <rect x="258" y="290" width="42" height="24" rx="7" fill="none" stroke="#f5a623" stroke-width="1.5"/>
  <!-- Indicador laranja pequeno -->
  <circle cx="279" cy="302" r="4" fill="#f5a623" filter="url(#glow-orange)"/>
  <!-- Linha central do knob -->
  <rect x="266" y="301" width="8" height="2" rx="1" fill="rgba(255,255,255,0.3)"/>
  <rect x="285" y="301" width="8" height="2" rx="1" fill="rgba(255,255,255,0.3)"/>

  <!-- === FADER 4 === -->
  <!-- Trilha -->
  <rect x="369" y="80" width="6" height="352" rx="3" fill="#1a1a2e"/>
  <!-- Trilha ativa -->
  <rect x="369" y="200" width="6" height="232" rx="3" fill="#4a3fa0" opacity="0.5"/>
  <!-- Knob -->
  <rect x="351" y="180" width="42" height="24" rx="7" fill="url(#fader3)" filter="url(#glow)"/>
  <!-- Linha central do knob -->
  <rect x="359" y="191" width="26" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>

  <!-- Linha base sutil -->
  <rect x="70" y="432" width="372" height="2" rx="1" fill="#1e1e3a" opacity="0.8"/>
</svg>